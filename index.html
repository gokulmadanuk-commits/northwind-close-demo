<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Northwind close demo</title>
<meta name="description" content="From inbox to accounts: a year-end close with Claude in Cowork, on a fictional PE-backed logistics company.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 2L38 20 20 38 2 20z' fill='%230E5A6B'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
:root{
  color-scheme: light;
  --ground:#EEF1F0; --card:#FFFFFF; --ink:#14232C; --ink2:#4A5B64; --ink3:#7A8A92; --line:#D9E0DF; --line2:#E9EEED;
  --teal:#0E5A6B; --teal2:#3C8796; --teal3:#A9CDD4; --tealbg:#E6F0F2;
  --amber:#F0A500; --amberdk:#8A5C00; --amberbg:#FFF4D6;
  --neg:#B3412F; --pos:#1F7A4D; --posbg:#E5F3EB;
  --nav:248px; --r:10px;
  --f:"Barlow", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --fc:"Barlow Condensed", "Barlow", system-ui, Arial, sans-serif;
}
:root[data-theme="dark"]{ color-scheme: light; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--teal)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- navigation ---------- */
#nav{position:fixed;inset:0 auto 0 0;width:var(--nav);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;text-decoration:none;color:var(--ink)}
.brand svg{flex:0 0 34px}
.brand b{font-family:var(--fc);font-weight:700;font-size:22px;letter-spacing:.2px;line-height:1}
.brand span{display:block;font-size:12.5px;color:var(--ink3);line-height:1.2;margin-top:2px}
#nav nav{flex:1;overflow-y:auto;padding:6px 10px}
.nv{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:15px;font-weight:500;cursor:pointer;position:relative}
.nv svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:var(--ground);color:var(--ink)}
.nv[aria-current="page"]{background:var(--tealbg);color:var(--teal);font-weight:600}
.nv[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--amber)}
.nv.star{color:var(--ink)}
.navgap{height:1px;background:var(--line2);margin:8px 12px}
.navfoot{padding:14px 18px 18px;border-top:1px solid var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.amber{background:var(--amber);color:#2B1E00}
.btn.amber:hover{background:#FFB61A}
.btn.teal{background:var(--teal);color:#fff}
.btn.teal:hover{background:#0B4C5B}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink3)}
.btn.sm{padding:6px 11px;font-size:13.5px}
.navfoot .btn{width:100%}
.navlinks{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.navlinks a{color:var(--ink2);text-decoration:none}
.navlinks a:hover{color:var(--teal);text-decoration:underline}
#topbar{display:none}
#scrim{display:none}

/* ---------- main ---------- */
#main{margin-left:var(--nav);min-height:100vh}
.page{max-width:1120px;margin:0 auto;padding:30px 36px 60px}
.page h1{font-family:var(--fc);font-weight:700;font-size:38px;line-height:1.05;margin:0 0 6px;letter-spacing:-.2px}
.lede{color:var(--ink2);margin:0 0 22px;max-width:70ch}
.page h2{font-family:var(--fc);font-weight:600;font-size:24px;margin:34px 0 10px}
.page h3{font-size:16px;margin:22px 0 8px}
.muted{color:var(--ink3)}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--ground);color:var(--ink2);vertical-align:middle}
.tag.ok{background:var(--posbg);color:var(--pos)}
.tag.amber{background:var(--amberbg);color:var(--amberdk)}
.tag.teal{background:var(--tealbg);color:var(--teal)}
.tag:empty{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.panel.pad{padding:18px 20px}
.note{background:var(--amberbg);border-left:4px solid var(--amber);border-radius:6px;padding:12px 16px;color:#3E2E00;font-size:15px;margin:0 0 18px}
.stamp{font-size:13px;color:var(--ink3)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:4px 0 18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 13px}
.kpi .l{font-size:13.5px;color:var(--ink2);font-weight:500}
.kpi .v{font-family:var(--fc);font-weight:600;font-size:31px;line-height:1.1;margin-top:4px}
.kpi .s{font-size:13px;color:var(--ink3);margin-top:3px}
.kpi.hl{border-color:var(--teal3);box-shadow:inset 0 3px 0 var(--teal)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.chart{padding:16px 18px 10px}
.chart h3{margin:0 0 2px;font-size:15.5px}
.chart .sub{font-size:13px;color:var(--ink3);margin-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:2px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg.ch text{font-family:var(--f);font-size:11.5px;fill:var(--ink3)}
svg.ch .lbl{fill:var(--ink2);font-size:12.5px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:6px 9px;border-radius:6px;z-index:90;display:none;white-space:nowrap}

/* tree statements */
.stmt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line2);font-size:15px;cursor:pointer;user-select:none}
.srow:hover{background:#F7FAF9}
.srow .c{width:16px;flex:0 0 16px;color:var(--ink3);font-size:11px}
.srow .l{flex:1 1 auto;min-width:0}
.srow .a{flex:0 0 150px;text-align:right;font-variant-numeric:tabular-nums}
.srow .a2{flex:0 0 130px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.srow.parent .l{font-weight:600}
.srow.sub .l{font-weight:600;color:var(--teal)}
.srow.tot{background:#F3F6F5;font-weight:600;cursor:default}
.srow.grand{background:var(--tealbg);color:var(--ink);font-weight:700;cursor:default;font-family:var(--fc);font-size:18px}
.srow.head{background:#F3F6F5;font-size:13px;color:var(--ink2);font-weight:600;cursor:default}
.neg{color:var(--neg)}
.txns{background:#FAFCFB;border-bottom:1px solid var(--line2)}
.txn{display:flex;gap:12px;padding:6px 16px 6px 50px;font-size:14px;color:var(--ink2);border-top:1px dashed var(--line2)}
.txn .d{flex:0 0 86px;color:var(--ink3)}
.txn .x{flex:1;min-width:0}
.txn .x b{color:var(--ink);font-weight:600}
.txn .f{display:block;font-size:13px}
.txn .f a{text-decoration:none;border-bottom:1px solid var(--teal3)}
.txn .v{flex:0 0 120px;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:13.5px;color:var(--ink3);margin:10px 2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 13px;font-size:14px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}

/* journals + adjustments */
.jcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.jcard.posted{border-color:#9FD1B5;box-shadow:inset 4px 0 0 var(--pos)}
.jcard h3{margin:0 0 4px;font-size:16.5px}
.jcard p{margin:4px 0 8px;color:var(--ink2);font-size:14.5px}
.jl{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.jl td{padding:4px 6px;border-top:1px solid var(--line2)}
.jl td.n{text-align:right;font-variant-numeric:tabular-nums;width:120px}
.jactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.effect{font-size:14px;color:var(--ink2)}
.form input,.form select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.form .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.form .row input.acct{flex:1 1 260px}
.form .row input.amt{width:120px;text-align:right}
.err{color:var(--neg);font-size:14px}
.adjrow{display:grid;grid-template-columns:34px 1fr 140px 170px;gap:12px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line2)}
.adjrow:last-child{border-bottom:0}
.adjid{font-family:var(--fc);font-weight:700;font-size:20px;color:var(--teal);line-height:1.2}
.adjrow .t{font-weight:600}
.adjrow .w{font-size:14px;color:var(--ink2);margin-top:2px}
.adjrow .src{font-size:13.5px;margin-top:4px}
.adjrow .amt{text-align:right;font-family:var(--fc);font-size:20px;font-weight:600}
.decide{display:flex;gap:6px;justify-content:flex-end}
.decide button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:13.5px;cursor:pointer}
.decide button[aria-pressed="true"].yes{background:var(--pos);border-color:var(--pos);color:#fff}
.decide button[aria-pressed="true"].no{background:var(--ink2);border-color:var(--ink2);color:#fff}
.adjrow.declined .amt{color:var(--ink3);text-decoration:line-through}

/* downloads + build */
.dl{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.dl .ic{flex:0 0 40px;height:40px;border-radius:9px;background:var(--tealbg);display:grid;place-items:center}
.dl .ic svg{width:21px;height:21px;stroke:var(--teal);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dl .t{font-weight:600;font-size:16px}
.dl .d{color:var(--ink2);font-size:14.5px;margin:3px 0 10px;max-width:68ch}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.step b{display:block;font-family:var(--fc);font-size:19px;font-weight:600;margin-bottom:4px}
.step b::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--amber);color:#2B1E00;font-size:14px;margin-right:8px;vertical-align:2px}
.step p{margin:0;color:var(--ink2);font-size:14.5px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.phead{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.phead .pn{font-family:var(--fc);font-weight:700;font-size:22px;color:var(--teal);width:28px}
.phead .pt{flex:1;font-weight:600;font-size:16px}
.phead .chev{color:var(--ink3);transition:transform .2s}
.pcard.open .chev{transform:rotate(90deg)}
.pbody{display:none;padding:0 16px 16px 56px}
.pcard.open .pbody{display:block}
.ptext{white-space:pre-wrap;background:#F6F8F7;border:1px solid var(--line2);border-radius:8px;padding:12px 14px;font-size:14.5px;color:var(--ink);line-height:1.55;margin:10px 0}
.copied{font-size:13.5px;color:var(--pos);margin-left:6px}
.cta{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:28px;box-shadow:inset 0 4px 0 var(--amber)}
.cta h2{margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.facts .panel h3{margin-top:0}
.facts p{margin:0;color:var(--ink2);font-size:14.5px}
table.simple{width:100%;border-collapse:collapse;font-size:14.5px}
table.simple th{text-align:left;font-size:13px;color:var(--ink2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.simple td{padding:8px 10px;border-bottom:1px solid var(--line2)}
table.simple td.n,table.simple th.n{text-align:right;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:860px){table.simple{font-size:13px}table.simple td,table.simple th{padding:6px 5px}}

/* ---------- responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2,.grid2b{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}
@media (max-width:860px){
  #nav{transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 10px 40px rgba(20,35,44,.25)}
  body.navopen #nav{transform:none}
  body.navopen #scrim{display:block;position:fixed;inset:0;background:rgba(20,35,44,.35);z-index:35}
  #topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:9px 14px}
  #topbar .brand{padding:0}
  #topbar .mail{margin-left:auto}
  #topbar .li{font-weight:700;padding-left:11px;padding-right:11px}
  #main{margin-left:0}
  .page{padding:20px 16px 50px}
  .page h1{font-size:30px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:26px}
  .steps{grid-template-columns:1fr}
  .srow .a{flex-basis:110px}.srow .a2{display:none}
  .txn{padding-left:28px;flex-wrap:wrap}.txn .d{flex-basis:76px}.txn .v{flex-basis:90px}
  .adjrow{grid-template-columns:28px 1fr;}
  .adjrow .amt{text-align:left;grid-column:2}
  .adjrow .decide{grid-column:2;justify-content:flex-start}
  .pbody{padding-left:16px}
}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.kpis.k3{grid-template-columns:1fr}}

/* v5: statement toggles, view bar, waterfall, nav footer, contact popup */
.srow .c{width:32px;flex:0 0 32px;display:flex;align-items:center;font-size:inherit}
.srow .tg{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--tealbg);border:1px solid #C3DADF;color:var(--teal);transition:background .15s,color .15s}
.srow .tg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
.srow.open .tg svg{transform:rotate(90deg)}
.srow.leaf .tg{background:var(--card);border-color:var(--line)}
.srow:hover .tg{background:var(--teal);border-color:var(--teal);color:#fff}
.srow:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.srow.flash{animation:rowflash 1.8s ease}
@keyframes rowflash{0%,45%{background:var(--amberbg)}100%{background:transparent}}
.viewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.viewbar .seg{margin-left:auto}
.treetools{display:flex;gap:8px;flex-wrap:wrap}
.treetools .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.wfwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wfwrap .wf2{min-width:660px;display:block}
.wf2 text{font-size:12px;fill:var(--ink3)}
.wf2 .wv{font-family:var(--fc);font-weight:600;font-size:15px;fill:var(--ink)}
.wf2 .wl{font-size:12.5px;fill:var(--ink2)}
.wfb{cursor:pointer;outline:none}
.wfb:hover rect:nth-child(2),.wfb:focus-visible rect:nth-child(2){filter:brightness(1.12)}
.wfb:focus-visible rect:first-child{stroke:var(--teal);stroke-width:1.5}
.navfoot .resetrow{display:flex;align-items:center;gap:8px}
.navfoot .resetrow .btn{width:auto}
.resetrow .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.resetrow .copied{font-size:13px;color:var(--pos);font-weight:600}
.helpnote{font-size:13.5px;line-height:1.45;color:var(--ink2);margin:14px 0 6px}
.helpnote .sig{display:block;margin-top:5px;color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--teal);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.linkbtn:hover{text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(20,35,44,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal[hidden]{display:none}
body.modalopen{overflow:hidden}
.mcard{position:relative;background:var(--card);border-radius:16px;box-shadow:0 30px 80px rgba(20,35,44,.3);padding:38px 42px;max-width:620px;width:100%}
.mclose{position:absolute;top:10px;right:12px;border:0;background:none;font-size:28px;line-height:1;color:var(--ink3);cursor:pointer;width:38px;height:38px;border-radius:8px}
.mclose:hover{background:#EEF1F0;color:var(--ink)}
.ccard{display:flex;gap:30px;align-items:center}
.cphoto{width:150px;height:150px;border-radius:50%;object-fit:cover;flex:0 0 150px;box-shadow:0 0 0 6px var(--tealbg)}
.cphoto.mono{display:grid;place-items:center;background:var(--teal);color:#fff;font-family:var(--fc);font-size:54px;font-weight:700}
.ccard h2{font-family:var(--fc);font-size:42px;font-weight:700;margin:0 0 14px;line-height:1}
.ccard .clist{display:grid;gap:11px}
.ccard .clist a{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--ink);text-decoration:none;word-break:break-word}
.ccard .clist a:hover{color:var(--teal);text-decoration:underline}
.ccard .clist svg{width:22px;height:22px;stroke:var(--teal);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 22px}
@media (max-width:560px){.ccard{flex-direction:column;text-align:center;gap:20px}.ccard .clist a{justify-content:center}.mcard{padding:34px 20px 26px}.cphoto{width:128px;height:128px;flex-basis:128px}}
@media (max-width:860px){.viewbar .seg{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media print{#nav,#topbar{display:none}#main{margin:0}}
</style>
</head>
<body><div class="page"><p>Loading the Northwind demo…</p></div>
<noscript><div class="page"><p>This demo needs JavaScript.</p></div></noscript>
<script>/* Northwind close demo: site app (fictional company). Data is loaded from small JSON chunks. */
(function(){
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(n*100)/100;
const fmt = (n, dp=2) => { if (Math.abs(n) < 0.005) return '–'; const s = Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp}); return n<0 ? '('+s+')' : s; };
const gbp = (n, dp=0) => (n<0?'-':'') + '£' + Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const gbpShort = n => { const a=Math.abs(n), s=n<0?'-':''; if (a>=1e6) return s+'£'+(a/1e6).toFixed(2)+'m'; if (a>=1e3) return s+'£'+(a/1e3).toFixed(0)+'k'; return s+'£'+a.toFixed(0); };
const dmy = d => d.split('-').reverse().join('/');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };

let D, ACC, BYCODE = {}, BASE = [], J = [], DEC = {}, TX, B, T, MONTHLY, MODE = {pl:'table', cf:'table'};
const JKEY = 'nwl-demo-journals-v1', AKEY = 'nwl-demo-adj-v1';

// --------------------------------------------------------------------------- data
async function load(){
  const man = await fetch('data/manifest.json', {cache:'no-cache'}).then(r => r.json());
  const parts = await Promise.all(man.chunks.map(u => fetch(u, {cache:'no-cache'}).then(r => r.json())));
  const d = {}; for (const p of parts) for (const k in p){ if (Array.isArray(p[k]) && Array.isArray(d[k])) d[k] = d[k].concat(p[k]); else if (d[k] && typeof p[k] === 'object' && !Array.isArray(p[k])) Object.assign(d[k], p[k]); else d[k] = p[k]; }
  return d;
}
function init(d){
  D = d; ACC = D.acc;
  ACC.forEach((a, i) => { a.i = i; BYCODE[a.c] = a; });
  BASE = D.tx.map(([date, payee, narr, rc, kind, ps]) => ({date, payee, narr, rc, kind, ps}));
  const saved = store.get(JKEY, null);
  J = saved !== null ? saved : defaultJ();
  DEC = Object.assign({}, Object.fromEntries(D.adj.map(a => [a.id, a.dec])), store.get(AKEY, {}));
  recompute();
}
function defaultJ(){ return D.ye.filter(y => (D.meta.default_posted || []).includes(y.id)).map(y => ({id:y.id, date:y.date, desc:y.desc, lines:y.lines.map(l => l.slice())})); }
function acctIndex(name){ let a = ACC.find(x => x.a === name || x.c === name); return a ? a.i : -1; }
function recompute(){
  const posted = J.map(j => ({date:j.date, payee:'Year-end journal', narr:j.desc, rc:'', kind:'Y', id:j.id, ps:j.lines}));
  TX = BASE.concat(posted);
  B = new Array(ACC.length).fill(0); T = ACC.map(() => []);
  for (const t of TX) for (const [ai, amt] of t.ps){ B[ai] += amt; T[ai].push(t); }
  for (let i=0;i<B.length;i++) B[i] = r2(B[i]);
  MONTHLY = monthly();
  const jb = $('#jcount'); if (jb){ const pend = D.ye.filter(y => !J.some(j => j.id === y.id)).length; jb.textContent = pend ? pend + ' to review' : ''; }
}
const bal = code => { const a = BYCODE[code]; return a ? B[a.i] : 0; };
const sumWhere = f => ACC.reduce((s, a) => s + (f(a) ? B[a.i] : 0), 0);
const sec = s => sumWhere(a => a.s === s);
function figures(Bx){
  const g = f => ACC.reduce((s, a) => s + (f(a) ? Bx[a.i] : 0), 0);
  const revenue = -g(a => a.r === 'Income');
  const sales = -g(a => a.s === 'Revenue');
  const direct = g(a => a.s === 'DirectCosts');
  const over = g(a => a.s === 'Overheads');
  const dep = g(a => a.s === 'DepreciationAndAmortisation');
  const fin = g(a => a.s === 'FinanceCosts');
  const tax = g(a => a.s === 'Taxation');
  const gp = revenue - direct, ebitda = gp - over, ebit = ebitda - dep, pbt = ebit - fin, pat = pbt - tax;
  return {revenue, sales, direct, over, dep, fin, tax, gp, ebitda, ebit, pbt, pat};
}
function adjAmount(a){ if (a.dyn){ const ai = acctIndex(a.dyn); return ai < 0 ? 0 : r2(a.dynSign * B[ai]); } return a.amt; }
function adjusted(){
  const f = figures(B); let net = 0, n = 0;
  for (const a of D.adj) if (DEC[a.id] === 'approved'){ net += adjAmount(a); n++; }
  return {reported: f.ebitda, net: r2(net), adjusted: r2(f.ebitda + net), n};
}
function leverage(){
  const cash = bal(D.meta.cash_code), debt = -bal(D.meta.loan_code);
  const adj = adjusted().adjusted; return {cash, debt, net: debt - cash, x: (debt - cash) / adj};
}
function monthly(){
  // month keys from Apr to Mar of the FY
  const keys = D.meta.months; const out = keys.map(k => ({k, rev:0, direct:0, over:0, ebitda:0, cash:0}));
  const idx = Object.fromEntries(keys.map((k,i)=>[k,i]));
  const cashI = BYCODE[D.meta.cash_code].i; let cash = 0;
  const cashBy = new Array(keys.length).fill(null);
  const sorted = TX.slice().sort((a,b)=>a.date.localeCompare(b.date));
  for (const t of sorted){
    const k = t.date.slice(0,7); const m = idx[k];
    for (const [ai, amt] of t.ps){
      const a = ACC[ai];
      if (ai === cashI) cash += amt;
      if (m === undefined) continue;
      if (a.r === 'Income') out[m].rev -= amt;
      else if (a.s === 'DirectCosts') out[m].direct += amt;
      else if (a.s === 'Overheads') out[m].over += amt;
    }
    if (m !== undefined) cashBy[m] = cash;
  }
  out.forEach((o, i) => { o.ebitda = o.rev - o.direct - o.over; o.cash = cashBy[i] ?? (i ? out[i-1].cash : 0); });
  out.opening = D.meta.opening_cash;
  return out;
}

// --------------------------------------------------------------------------- shell
const VIEWS = [
  ['dashboard','Dashboard','<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'],
  ['trial-balance','Trial balance','<path d="M12 3v18M5 7h14M7 7l-3 7h6zM17 7l-3 7h6z"/>'],
  ['profit-and-loss','Profit and loss','<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>'],
  ['balance-sheet','Balance sheet','<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M12 5v14M3 12h18"/>'],
  ['cash-flow','Cash flow','<path d="M4 8h13l-3-3M20 16H7l3 3"/>'],
  ['ebitda','EBITDA adjustments','<path d="M4 20h16M6 16v-5M10 16V8M14 16v-3M18 16V6"/>'],
  ['journals','Year-end journals','<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/>'],
  ['downloads','Downloads','<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'],
  ['build','Build it yourself','<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>'],
];
const MARK = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2L38 20 20 38 2 20z" fill="#0E5A6B"/><path d="M14 27V13h2.6l7 9.4V13H26v14h-2.5l-7.1-9.5V27z" fill="#fff"/></svg>';
const CHEV = '<span class="tg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>';
const CICON = {mail:'<path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/>', link:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2.5 2.5 0 0 1 5 0v4M12 10v7"/>', web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'};
function contactCard(){
  const c = D.meta.contact, mail = `mailto:${c.email}?subject=${encodeURIComponent(c.subject)}`;
  return `<div class="ccard">${c.photo ? `<img class="cphoto" src="${esc(c.photo)}" alt="Gokul Madan">` : '<div class="cphoto mono" aria-hidden="true">GM</div>'}
    <div><h2 id="ctitle">Gokul Madan</h2><div class="clist">
      <a href="${esc(mail)}"><svg viewBox="0 0 24 24" aria-hidden="true">${CICON.mail}</svg>${esc(c.email)}</a>
      <a href="${esc(c.linkedin)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true">${CICON.link}</svg>${esc(c.linkedin.replace(/^https:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a>
      <a href="${esc(c.web)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true">${CICON.web}</svg>${esc(c.web.replace(/^https:\/\//, ''))}</a></div></div></div>`;
}
let lastFocus = null;
function openContact(){ lastFocus = document.activeElement; const m = $('#contact'); m.hidden = false; document.body.classList.add('modalopen'); $('.mclose', m).focus(); }
function closeContact(){ const m = $('#contact'); if (!m || m.hidden) return; m.hidden = true; document.body.classList.remove('modalopen'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function resetDemo(){
  J = defaultJ(); DEC = Object.fromEntries(D.adj.map(a => [a.id, a.dec])); MODE = {pl:'table', cf:'table'};
  try { localStorage.removeItem(JKEY); localStorage.removeItem(AKEY); } catch(e){}
  recompute(); route();
  const m = $('#resetmsg'); if (m){ m.textContent = 'Demo reset'; clearTimeout(resetDemo.t); resetDemo.t = setTimeout(() => { m.textContent = ''; }, 2200); }
}
function shell(){
  document.body.innerHTML = `
  <div id="topbar"><button class="btn ghost sm" id="menu" aria-label="Open menu" aria-expanded="false">Menu</button>
    <a class="brand" href="#/dashboard">${MARK}<div><b>Northwind</b><span>AI close demo</span></div></a></div>
  <div id="scrim"></div>
  <aside id="nav" aria-label="Site">
    <a class="brand" href="#/dashboard">${MARK}<div><b>Northwind</b><span>AI close demo · fictional company</span></div></a>
    <nav>${VIEWS.map(([id, label, ic], k) => `${k===1||k===7?'<div class="navgap"></div>':''}<button class="nv${id==='build'?' star':''}" data-v="${id}"><svg viewBox="0 0 24 24">${ic}</svg><span>${label}</span>${id==='journals'?' <span class="tag amber" id="jcount"></span>':''}</button>`).join('')}</nav>
    <div class="navfoot">
      <div class="resetrow"><button class="btn ghost sm" id="resetdemo" title="Put the journals and the adjustment decisions back to how the close left them"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>Reset the demo</button><span class="copied" id="resetmsg" role="status"></span></div>
      <p class="helpnote">If you want some help setting up something like this or to brainstorm other AI solutions in finance, I'm always happy to help.<span class="sig">— Gokul</span></p>
      <button class="linkbtn" id="contactbtn">Contact <span aria-hidden="true">↗</span></button>
    </div>
  </aside>
  <main id="main"></main><div class="tip" id="tip"></div>
  <div class="modal" id="contact" role="dialog" aria-modal="true" aria-labelledby="ctitle" hidden><div class="mcard"><button class="mclose" aria-label="Close">×</button>${contactCard()}</div></div>`;
  $$('.nv').forEach(b => b.onclick = () => { location.hash = '#/' + b.dataset.v; });
  $('#menu').onclick = () => { const o = document.body.classList.toggle('navopen'); $('#menu').setAttribute('aria-expanded', o); };
  $('#scrim').onclick = () => document.body.classList.remove('navopen');
  $('#resetdemo').onclick = resetDemo;
  $('#contactbtn').onclick = () => { document.body.classList.remove('navopen'); openContact(); };
  $('#contact').addEventListener('click', e => { if (e.target.id === 'contact' || e.target.closest('.mclose')) closeContact(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeContact(); });
  window.addEventListener('hashchange', route);
  recompute(); route();
}
function route(){
  const v = (location.hash.replace(/^#\/?/, '') || 'dashboard').split('/')[0];
  const id = VIEWS.some(x => x[0] === v) ? v : 'dashboard';
  $$('.nv').forEach(b => { if (b.dataset.v === id) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  document.body.classList.remove('navopen');
  const main = $('#main'); main.innerHTML = '';
  (PAGES[id] || PAGES.dashboard)(main);
  window.scrollTo(0, 0);
  document.title = VIEWS.find(x => x[0] === id)[1] + ' · Northwind close demo';
}
const page = (main, title, lede) => { const p = document.createElement('div'); p.className = 'page'; p.innerHTML = `<h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:''}`; main.appendChild(p); return p; };
const yeNote = () => { const p = J.map(j => j.id).filter(Boolean); const open = D.ye.filter(y => !p.includes(y.id)).map(y => y.id); return (p.length ? `Year-end journals posted: ${p.join(', ')}.` : 'No year-end journals posted.') + (open.length ? ` ${open.join(' and ')} ${open.length > 1 ? 'are' : 'is'} waiting on the Year-end journals page.` : ''); };

// --------------------------------------------------------------------------- charts (hand-rolled SVG)
const tip = (e, html) => { const t = $('#tip'); if (!html){ t.style.display = 'none'; return; } t.innerHTML = html; t.style.display = 'block'; t.style.left = Math.min(e.clientX + 12, innerWidth - t.offsetWidth - 8) + 'px'; t.style.top = (e.clientY - 34) + 'px'; };
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if (m*p >= v) return m*p; return v; }
function monthChart(el){
  const M = MONTHLY, W = 640, H = 300, L = 48, R = 10, top = 14, mid = 196, bot = 270;
  const vmax = niceMax(Math.max(...M.map(m => Math.max(m.rev, m.direct + m.over))));
  const emax = niceMax(Math.max(...M.map(m => Math.abs(m.ebitda)))) || 1;
  const bw = (W - L - R) / M.length;
  const y1 = v => mid - (v / vmax) * (mid - top);
  const y2 = v => bot - (v / emax) * (bot - mid - 22);
  let g = '';
  for (let k=0;k<=4;k++){ const v = vmax*k/4, y = y1(v); g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E9EEED"/><text x="${L-6}" y="${y+4}" text-anchor="end">${gbpShort(v)}</text>`; }
  g += `<text x="${L-6}" y="${bot+4}" text-anchor="end">£0</text><text x="${L-6}" y="${y2(emax)+4}" text-anchor="end">${gbpShort(emax)}</text><line x1="${L}" x2="${W-R}" y1="${bot}" y2="${bot}" stroke="#D9E0DF"/>`;
  M.forEach((m, i) => {
    const x = L + i*bw, cost = m.direct + m.over;
    const lab = MON[+m.k.slice(5,7)-1] + ' ' + m.k.slice(2,4);
    g += `<rect class="hov" data-i="${i}" x="${x+bw*0.14}" y="${y1(m.rev)}" width="${bw*0.34}" height="${mid-y1(m.rev)}" fill="#0E5A6B" rx="2"/>`;
    g += `<rect class="hov" data-i="${i}" x="${x+bw*0.5}" y="${y1(cost)}" width="${bw*0.34}" height="${mid-y1(cost)}" fill="#A9CDD4" rx="2"/>`;
    const ey = y2(Math.max(m.ebitda,0));
    g += `<rect class="hov" data-i="${i}" x="${x+bw*0.22}" y="${ey}" width="${bw*0.56}" height="${Math.max(1,bot-ey)}" fill="${m.ebitda<0?'#B3412F':'#F0A500'}" rx="2"/>`;
    g += `<text x="${x+bw/2}" y="${mid+15}" text-anchor="middle">${lab.split(' ')[0]}</text>`;
  });
  g += `<text x="${L}" y="${mid+36}" class="lbl">EBITDA by month</text>`;
  el.innerHTML = `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly revenue, costs and EBITDA">${g}</svg>`;
  $$('.hov', el).forEach(r => { r.onmousemove = e => { const m = M[+r.dataset.i]; tip(e, `<b>${MON[+m.k.slice(5,7)-1]} ${m.k.slice(0,4)}</b><br>Revenue ${gbp(m.rev)}<br>Costs ${gbp(m.direct+m.over)}<br>EBITDA ${gbp(m.ebitda)}`); }; r.onmouseleave = e => tip(e); });
}
function cashChart(el){
  const pts = [{k:'open', cash:MONTHLY.opening}].concat(MONTHLY.map(m => ({k:m.k, cash:m.cash})));
  const W = 640, H = 230, L = 48, R = 14, top = 12, bot = 200;
  const vmax = niceMax(Math.max(...pts.map(p => p.cash)) * 1.05);
  const x = i => L + i*(W-L-R)/(pts.length-1), y = v => bot - v/vmax*(bot-top);
  let g = '';
  for (let k=0;k<=4;k++){ const v = vmax*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E9EEED"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${gbpShort(v)}</text>`; }
  const line = pts.map((p,i) => `${x(i)},${y(p.cash)}`).join(' ');
  g += `<polygon points="${x(0)},${bot} ${line} ${x(pts.length-1)},${bot}" fill="#E6F0F2"/><polyline points="${line}" fill="none" stroke="#0E5A6B" stroke-width="2.4"/>`;
  pts.forEach((p,i) => { g += `<circle class="hov" data-i="${i}" cx="${x(i)}" cy="${y(p.cash)}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?'#F0A500':'#0E5A6B'}" stroke="#fff" stroke-width="1.5"/>`;
    g += `<text x="${x(i)}" y="${bot+16}" text-anchor="middle">${i===0?'Open':MON[+p.k.slice(5,7)-1]}</text>`; });
  el.innerHTML = `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cash at each month end">${g}</svg>`;
  $$('.hov', el).forEach(c => { c.onmousemove = e => { const p = pts[+c.dataset.i]; tip(e, `<b>${p.k==='open'?'31 Mar 2025':'End '+MON[+p.k.slice(5,7)-1]+' '+p.k.slice(0,4)}</b><br>Cash ${gbp(p.cash)}`); }; c.onmouseleave = e => tip(e); });
}
function hbar(el, rows, color){
  const W = 640, rowH = 30, L = 210, R = 70, H = rows.length*rowH + 6;
  const vmax = Math.max(...rows.map(r => r[1]));
  let g = '';
  rows.forEach(([lab, v], i) => { const y = i*rowH + 4, w = (W-L-R)*v/vmax;
    g += `<text x="${L-10}" y="${y+18}" text-anchor="end" class="lbl">${esc(lab)}</text><rect x="${L}" y="${y+5}" width="${Math.max(2,w)}" height="18" rx="3" fill="${color}"/><text x="${L+w+6}" y="${y+18}">${gbpShort(v)}</text>`; });
  el.innerHTML = `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}

// --------------------------------------------------------------------------- pages
const PAGES = {};

PAGES.dashboard = main => {
  const f = figures(B), a = adjusted(), lv = leverage(), cov = D.meta.coverage;
  const p = page(main, 'Dashboard', `FY26, the year to 31 March 2026. Built from the ledger Claude produced in the March close. ${yeNote()}`);
  const head = (40 - lv.x/D.meta.covenant*40);
  p.insertAdjacentHTML('beforeend', `
  <div class="kpis">
    <div class="kpi"><div class="l">Revenue</div><div class="v num">${gbpShort(f.revenue)}</div><div class="s">FY26 incl. other income</div></div>
    <div class="kpi hl"><div class="l">Adjusted EBITDA</div><div class="v num">${gbpShort(a.adjusted)}</div><div class="s">Reported ${gbpShort(a.reported)} · ${a.n} adjustments approved</div></div>
    <div class="kpi"><div class="l">Cash at 31 March</div><div class="v num">${gbpShort(lv.cash)}</div><div class="s"><span class="tag ok">✓ agrees to bank</span></div></div>
    <div class="kpi"><div class="l">Net debt / Adj. EBITDA</div><div class="v num">${lv.x.toFixed(2)}x</div><div class="s">Covenant ${D.meta.covenant.toFixed(1)}x · ${Math.round((1-lv.x/D.meta.covenant)*100)}% headroom</div></div>
    <div class="kpi"><div class="l">Invoice coverage, March</div><div class="v num">${cov.have} / ${cov.total}</div><div class="s">${cov.note}</div></div>
  </div>
  <div class="grid2">
    <div class="panel chart"><h3>Revenue, costs and EBITDA by month</h3><div class="legend"><span><i style="background:#0E5A6B"></i>Revenue</span><span><i style="background:#A9CDD4"></i>Costs before D&amp;A</span><span><i style="background:#F0A500"></i>EBITDA</span></div><div id="c1"></div></div>
    <div class="panel chart"><h3>Cash at each month end</h3><div class="sub">Lindenhall current account, agreed to statements</div><div id="c2"></div></div>
  </div>
  <div class="grid2b">
    <div class="panel chart"><h3>Top 5 suppliers, March 2026</h3><div class="sub">Invoices booked in the close, excluding VAT</div><div id="c3"></div></div>
    <div class="panel chart"><h3>Where the money goes, FY26</h3><div class="sub">Costs before depreciation, interest and tax</div><div id="c4"></div></div>
  </div>
  <p class="hint">Click through on Profit and loss or Balance sheet to see every transaction and the receipt behind it.</p>`);
  monthChart($('#c1')); cashChart($('#c2'));
  const sup = {};
  for (const t of TX){ if (t.kind !== 'M' || !t.date.startsWith(D.meta.close_month)) continue; for (const [ai, amt] of t.ps){ const ac = ACC[ai]; if ((ac.s === 'DirectCosts' || ac.s === 'Overheads') && ac.c !== '320' && ac.c !== '477' && ac.c !== '479' && ac.c !== '482' && t.payee && !/journal|Payroll/i.test(t.payee)) sup[t.payee] = (sup[t.payee]||0) + amt; } }
  hbar($('#c3'), Object.entries(sup).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v]) => [k.replace(/ (Ltd|LLP|Inc\.)$/,''), v]), '#0E5A6B');

// tree statements
function tree(rows){ const root = {kids:{}, total:0};
  for (const [a, v] of rows){ let n = root; n.total += v; const parts = a.s === a.r ? [a.r, a.c] : [a.r, a.s, a.c]; parts.forEach((p, i) => { if (!p) return; n.kids[p] = n.kids[p] || {name:p, kids:{}, total:0, acct:null}; n = n.kids[p]; n.total += v; if (i === parts.length-1) n.acct = a; }); }
  return root; }
const SEC_LABEL = {Bank:'Cash at bank', CurrentAssets:'Current assets', FixedAssets:'Fixed assets', CurrentLiabilities:'Current liabilities', NonCurrentLiabilities:'Non-current liabilities',
  Revenue:'Revenue', OtherIncome:'Other income', DirectCosts:'Direct costs', Overheads:'Overheads', DepreciationAndAmortisation:'Depreciation', FinanceCosts:'Finance costs', Taxation:'Taxation', Equity:'Equity'};
function txnList(a, mult){
  return T[a.i].slice().sort((x,y)=>x.date.localeCompare(y.date)).map(t => { const amt = t.ps.filter(p => p[0] === a.i).reduce((s,p)=>s+p[1],0) * mult;
    const doc = t.rc ? (D.docs[t.rc] ? `<a href="${esc(D.docs[t.rc])}" target="_blank" rel="noopener">${esc(t.rc.split('/').pop())}</a>` : esc(t.rc.split('/').pop())) : '';
    const kindTag = t.kind === 'E' ? '<span class="tag">ERP month</span> ' : t.kind === 'Y' ? '<span class="tag amber">year-end journal</span> ' : t.kind === 'O' ? '<span class="tag">opening</span> ' : '';
    return `<div class="txn"><span class="d">${dmy(t.date)}</span><span class="x">${kindTag}<b>${esc(t.payee)}</b> ${esc(t.narr)}${doc?`<span class="f">Evidence: ${doc}</span>`:''}</span><span class="v">${fmt(amt)}</span></div>`; }).join('');
}
function node(n, depth, mult, el, label, secId){
  const kids = Object.values(n.kids);
  const r = document.createElement('div');
  const isLeaf = !!n.acct; const v = mult * n.total; const hasT = isLeaf && T[n.acct.i].length > 0;
  r.className = 'srow ' + (isLeaf ? 'leaf' : depth === 0 ? 'parent' : 'sub');
  if (secId) r.id = secId;
  r.style.paddingLeft = (10 + depth*22) + 'px';
  const name = isLeaf ? `<span class="muted">${n.acct.c}</span>&nbsp; ${esc(n.acct.n)}` : esc(label || SEC_LABEL[n.name] || n.name);
  r.innerHTML = `<span class="c">${!isLeaf || hasT ? CHEV : ''}</span><span class="l">${name}</span><span class="a num ${v < -0.005 ? 'neg' : ''}">${fmt(v)}</span>`;
  el.appendChild(r); const box = document.createElement('div'); box.className = isLeaf ? 'txns' : 'kids'; el.appendChild(box);
  const show = on => { box.style.display = on ? '' : 'none'; r.classList.toggle('open', on); r.setAttribute('aria-expanded', on); };
  if (!isLeaf){ kids.sort((a,b) => (a.acct && b.acct) ? a.acct.c.localeCompare(b.acct.c) : 0).forEach(k => node(k, depth+1, mult, box)); r._set = show; show(true); }
  else if (hasT){ r._set = on => { if (on && !box.innerHTML) box.innerHTML = txnList(n.acct, mult); show(on); }; show(false); }
  else { r.style.cursor = 'default'; return; }
  r.tabIndex = 0; r.setAttribute('role', 'button');
  r.onclick = () => r._set(box.style.display === 'none');
  r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); r.onclick(); } };
}
// generic collapsible section for statements built from figures (cash flow)
function csec(box, it, depth){
  const r = document.createElement('div'); const has = !!(it.kids && it.kids.length);
  r.className = 'srow ' + (it.cls || (has ? (depth ? 'sub' : 'parent') : 'leaf')); r.style.paddingLeft = (10 + depth*22) + 'px'; if (it.id) r.id = it.id;

  box.appendChild(r);

  const kb = document.createElement('div'); kb.className = 'kids'; box.appendChild(kb); it.kids.forEach(k => csec(kb, k, depth + 1));

// waterfall chart: steps [{l, v, t:'total'|'delta', key?:true, id}]
function waterfall(steps, opt){
  const W = 960, L = 64, R = 12, top = 34, bot = 318, H = 392;
  let run = 0; const segs = steps.map(s => { if (s.t === 'total'){ run = s.v; return Object.assign({a:0, b:s.v}, s); } const a = run; run += s.v; return Object.assign({a, b:run}, s); });
  const hi = niceMax(Math.max(...segs.map(s => Math.max(s.a, s.b))) * 1.04), lo = Math.min(0, ...segs.map(s => Math.min(s.a, s.b)));
  const y = v => bot - (v - lo) / (hi - lo) * (bot - top); const bw = (W - L - R) / segs.length;
  let g = '';
  for (let k=0;k<=4;k++){ const v = lo + (hi - lo)*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E9EEED"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${gbpShort(v)}</text>`; }
  g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#C9D3D2"/>`;
  segs.forEach((s, i) => {
    const x = L + i*bw + bw*0.16, w = bw*0.68, y0 = y(Math.max(s.a, s.b)), h = Math.max(1.5, Math.abs(y(s.a) - y(s.b)));
    const col = s.t === 'total' ? (s.key ? '#F0A500' : '#0E5A6B') : (s.v >= 0 ? '#1F7A4D' : '#C98A2E');
    const lab = s.t === 'total' ? gbpShort(s.v) : (Math.abs(s.v) < 0.5 ? '–' : (s.v >= 0 ? '+' : '−') + gbpShort(Math.abs(s.v)));
    if (i < segs.length - 1){ const nx = L + (i+1)*bw + bw*0.16; g += `<line x1="${x + w}" x2="${nx}" y1="${y(s.b)}" y2="${y(s.b)}" stroke="#9AA9AE" stroke-dasharray="3 3"/>`; }
    g += `<g class="hov wfb" data-i="${i}"${s.id ? ` data-id="${s.id}"` : ''} tabindex="0" role="button" aria-label="${esc(s.l)} ${esc(lab)}"><rect x="${x - bw*0.1}" y="${top - 20}" width="${w + bw*0.2}" height="${bot - top + 20}" fill="transparent"/><rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="2.5" fill="${col}"/>
      <text x="${x + w/2}" y="${y0 - 8}" text-anchor="middle" class="wv">${lab}</text></g>`;
    const words = s.l.split(' '), lines = []; words.forEach(wd => { const last = lines[lines.length - 1]; if (last && (last + ' ' + wd).length <= 12) lines[lines.length - 1] = last + ' ' + wd; else lines.push(wd); });
    g += `<text x="${x + w/2}" y="${bot + 20}" text-anchor="middle" class="wl">${lines.map((t, k) => `<tspan x="${x + w/2}" dy="${k ? 15 : 0}">${esc(t)}</tspan>`).join('')}</text>`;
  });
  return `<svg class="ch wf2" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.aria)}">${g}</svg>`;
}
function wireWaterfall(el, steps, key){
  $$('.wfb', el).forEach(b => { const s = steps[+b.dataset.i];
    b.onmousemove = e => tip(e, `<b>${esc(s.l)}</b><br>${s.t === 'total' ? '' : s.v >= 0 ? '+' : '−'}${gbp(Math.abs(s.v))}${b.dataset.id ? '<br><span style="opacity:.75">Click to see it in the table</span>' : ''}`);
    b.onmouseleave = e => tip(e);
    if (b.dataset.id){ const go = () => { tip(null); jumpTo(key, b.dataset.id); }; b.onclick = go; b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } }; } });
}

function cashflow(){
  const f = figures(B); const o = D.meta.opening_bal; const d = c => bal(c) - (o[c] || 0);
  const wc = [['Decrease / (increase) in trade debtors', -d('610')], ['Decrease / (increase) in prepayments', -d('620')],
    ['Increase / (decrease) in trade creditors', -d('800')], ['Increase / (decrease) in accruals and deferred income', -(d('805') + d('810'))],
    ['Increase / (decrease) in VAT, PAYE and pensions', -(d('820') + d('825') + d('826'))], ['Increase / (decrease) in card, wages and expense claims', -(d('811') + d('814') + d('801'))]];
  const wcT = wc.reduce((s,x)=>s+x[1],0);
  const ops = f.pbt + f.dep + f.fin + wcT;
  const taxPaid = -(f.tax + d('830'));   // charge less movement in provision
  const intPaid = -f.fin;
  const capex = -(d('720') + d('764'));
  const repay = (bal('900') - (o['900']||0));   // credit balances negative: repayment makes it less negative -> positive number
  const group = -d('615');

  return {f, wc, wcT, ops, taxPaid, intPaid, capex, repay: -repay, group, net, dcash: d(D.meta.cash_code), open: o[D.meta.cash_code] || 0};
}

function bridgeSVG(a){
  const items = D.adj.filter(x => DEC[x.id] === 'approved').map(x => [x.id + ' ' + x.title.split(' ').slice(0,3).join(' '), adjAmount(x)]);
  const steps = [['Reported', a.reported, 'total']].concat(items.map(i => [i[0], i[1], 'step'])).concat([['Adjusted', a.adjusted, 'total']]);
  const W = 640, H = 250, L = 10, R = 10, top = 16, bot = 190;
  const lo = Math.min(a.reported, a.adjusted) * 0.96, hi = Math.max(...steps.reduce((acc, s, i) => { acc.push(acc.length ? acc[acc.length-1] : 0); return acc; }, []), a.reported, a.adjusted) * 1.0;
  let run = 0, maxv = a.reported; const cum = [];
  for (const s of steps){ if (s[2] === 'total'){ run = s[1]; cum.push([0, s[1]]); } else { cum.push([run, run + s[1]]); run += s[1]; } maxv = Math.max(maxv, run); }
  const vmin = Math.min(...cum.map(c => Math.min(c[0] || Infinity, c[1]))) * 0.985, vmax = maxv * 1.01;
  const y = v => bot - (v - vmin) / (vmax - vmin) * (bot - top);
  const bw = (W - L - R) / steps.length;
  let g = `<line x1="${L}" x2="${W-R}" y1="${bot}" y2="${bot}" stroke="#D9E0DF"/>`;
  steps.forEach((s, i) => { const [a0, a1] = cum[i]; const x = L + i*bw + bw*0.18, w = bw*0.64;
    const top0 = s[2] === 'total' ? y(s[1]) : y(Math.max(a0, a1)), h0 = s[2] === 'total' ? bot - y(s[1]) : Math.abs(y(a0) - y(a1));
    const col = s[2] === 'total' ? '#0E5A6B' : (s[1] >= 0 ? '#1F7A4D' : '#B3412F');
    g += `<rect x="${x}" y="${top0}" width="${w}" height="${Math.max(2,h0)}" rx="2" fill="${col}"/>`;
    g += `<text x="${x+w/2}" y="${top0-5}" text-anchor="middle" class="lbl">${s[2]==='total'?gbpShort(s[1]):(s[1]>=0?'+':'−')+gbpShort(Math.abs(s[1])).replace('-','')}</text>`;
    g += `<text x="${x+w/2}" y="${bot+16}" text-anchor="middle">${esc(s[0].split(' ')[0])}</text>`; });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="EBITDA bridge">${g}<text x="${L}" y="${H-6}">Axis does not start at zero, so the adjustments are visible.</text></svg>`;
}

      <div class="panel pad"><h3>Accuracy</h3><p>Every closing balance is checked against a statement with a balance assertion; the ledger won't load if one is off by a penny. On this sample the result matched the answer key exactly.</p></div>
      <div class="panel pad"><h3>Privacy</h3><p>Claude works on the folders you select and the connectors you switch on, and nothing else. Use read-only exports if you prefer, and remove access when you're done.</p></div>
      <div class="panel pad"><h3>What still needs you</h3><p>Judgement calls, the EBITDA adjustments and sign-off. Claude prepares and explains; the CFO decides.</p></div></div>
    <div class="cta"><div><h2>Want some help to set this up for your own systems?</h2><p class="muted" style="margin:4px 0 0">Or brainstorm other AI automations? I'm always happy to help.</p></div><button class="btn amber" id="ctacontact">Contact Gokul</button></div>`);
  $('#ctacontact').onclick = openContact;
  let mode = 'sample';
  const draw = () => { $('#plist').innerHTML = D.prompts.map((x, i) => `<div class="pcard${i === 0 ? ' open' : ''}" data-i="${i}"><div class="phead" tabindex="0" role="button" aria-expanded="${i===0}"><span class="pn">${x.n}</span><span class="pt">${esc(x.title)}</span><span class="chev">▸</span></div>
      <div class="pbody"><div class="ptext">${esc(mode === 'sample' ? x.sample : x.own)}</div><button class="btn ghost sm cp" data-i="${i}">Copy prompt</button><span class="copied"></span></div></div>`).join('');
    $$('.phead').forEach(h => { const tg = () => { const c = h.parentElement; c.classList.toggle('open'); h.setAttribute('aria-expanded', c.classList.contains('open')); }; h.onclick = tg; h.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tg(); } }; });
    $$('.cp').forEach(b => b.onclick = async () => { const x = D.prompts[+b.dataset.i], t = mode === 'sample' ? x.sample : x.own, msg = b.nextElementSibling;
      try { await navigator.clipboard.writeText(t); msg.textContent = 'Copied'; } catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); msg.textContent = 'Copied'; } catch(e2){ msg.textContent = 'Select the text and copy it'; } ta.remove(); }
      setTimeout(() => msg.textContent = '', 2500); }); };
  $$('.seg button').forEach(b => b.onclick = () => { mode = b.dataset.m; $$('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  draw();
};

window.NWL = {recompute, figures: () => figures(B), adjusted, leverage, get D(){ return D; }, get J(){ return J; }, postAll(){ J = D.ye.map(y => ({id:y.id, date:y.date, desc:y.desc, lines:y.lines.map(l=>l.slice())})); store.set(JKEY, J); recompute(); }, reset(){ J = defaultJ(); store.set(JKEY, J); recompute(); }};
load().then(d => { init(d); shell(); }).catch(e => { document.body.innerHTML = '<div class="page"><h1>Something went wrong</h1><p>The demo data could not load. Refresh the page to try again.</p></div>'; console.error(e); });
})();
</script>
