<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Northwind close demo</title>
<meta name="description" content="From inbox to accounts: a year-end close with Claude in Cowork, on a fictional PE-backed logistics company.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 2L38 20 20 38 2 20z' fill='%230E5A6B'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
:root{
  color-scheme: light;
  --ground:#EEF1F0; --card:#FFFFFF; --ink:#14232C; --ink2:#4A5B64; --ink3:#7A8A92; --line:#D9E0DF; --line2:#E9EEED;
  --teal:#0E5A6B; --teal2:#3C8796; --teal3:#A9CDD4; --tealbg:#E6F0F2;
  --amber:#F0A500; --amberdk:#8A5C00; --amberbg:#FFF4D6;
  --neg:#B3412F; --pos:#1F7A4D; --posbg:#E5F3EB;
  --nav:248px; --r:10px;
  --f:"Barlow", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --fc:"Barlow Condensed", "Barlow", system-ui, Arial, sans-serif;
}
:root[data-theme="dark"]{ color-scheme: light; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--teal)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- navigation ---------- */
#nav{position:fixed;inset:0 auto 0 0;width:var(--nav);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;text-decoration:none;color:var(--ink)}
.brand svg{flex:0 0 34px}
.brand b{font-family:var(--fc);font-weight:700;font-size:22px;letter-spacing:.2px;line-height:1}
.brand span{display:block;font-size:12.5px;color:var(--ink3);line-height:1.2;margin-top:2px}
#nav nav{flex:1;overflow-y:auto;padding:6px 10px}
.nv{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:15px;font-weight:500;cursor:pointer;position:relative}
.nv svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:var(--ground);color:var(--ink)}
.nv[aria-current="page"]{background:var(--tealbg);color:var(--teal);font-weight:600}
.nv[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--amber)}
.nv.star{color:var(--ink)}
.navgap{height:1px;background:var(--line2);margin:8px 12px}
.navfoot{padding:14px 18px 18px;border-top:1px solid var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.amber{background:var(--amber);color:#2B1E00}
.btn.amber:hover{background:#FFB61A}
.btn.teal{background:var(--teal);color:#fff}
.btn.teal:hover{background:#0B4C5B}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink3)}
.btn.sm{padding:6px 11px;font-size:13.5px}
.navfoot .btn{width:100%}
.navlinks{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.navlinks a{color:var(--ink2);text-decoration:none}
.navlinks a:hover{color:var(--teal);text-decoration:underline}
#topbar{display:none}
#scrim{display:none}

/* ---------- main ---------- */
#main{margin-left:var(--nav);min-height:100vh}
.page{max-width:1120px;margin:0 auto;padding:30px 36px 60px}
.page h1{font-family:var(--fc);font-weight:700;font-size:38px;line-height:1.05;margin:0 0 6px;letter-spacing:-.2px}
.lede{color:var(--ink2);margin:0 0 22px;max-width:70ch}
.page h2{font-family:var(--fc);font-weight:600;font-size:24px;margin:34px 0 10px}
.page h3{font-size:16px;margin:22px 0 8px}
.muted{color:var(--ink3)}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--ground);color:var(--ink2);vertical-align:middle}
.tag.ok{background:var(--posbg);color:var(--pos)}
.tag.amber{background:var(--amberbg);color:var(--amberdk)}
.tag.teal{background:var(--tealbg);color:var(--teal)}
.tag:empty{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.panel.pad{padding:18px 20px}
.note{background:var(--amberbg);border-left:4px solid var(--amber);border-radius:6px;padding:12px 16px;color:#3E2E00;font-size:15px;margin:0 0 18px}
.stamp{font-size:13px;color:var(--ink3)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:4px 0 18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 13px}
.kpi .l{font-size:13.5px;color:var(--ink2);font-weight:500}
.kpi .v{font-family:var(--fc);font-weight:600;font-size:31px;line-height:1.1;margin-top:4px}
.kpi .s{font-size:13px;color:var(--ink3);margin-top:3px}
.kpi.hl{border-color:var(--teal3);box-shadow:inset 0 3px 0 var(--teal)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.chart{padding:16px 18px 10px}
.chart h3{margin:0 0 2px;font-size:15.5px}
.chart .sub{font-size:13px;color:var(--ink3);margin-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:2px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg.ch text{font-family:var(--f);font-size:11.5px;fill:var(--ink3)}
svg.ch .lbl{fill:var(--ink2);font-size:12.5px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:6px 9px;border-radius:6px;z-index:90;display:none;white-space:nowrap}

/* tree statements */
.stmt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line2);font-size:15px;cursor:pointer;user-select:none}
.srow:hover{background:#F7FAF9}
.srow .c{width:16px;flex:0 0 16px;color:var(--ink3);font-size:11px}
.srow .l{flex:1 1 auto;min-width:0}
.srow .a{flex:0 0 150px;text-align:right;font-variant-numeric:tabular-nums}
.srow .a2{flex:0 0 130px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.srow.parent .l{font-weight:600}
.srow.sub .l{font-weight:600;color:var(--teal)}
.srow.tot{background:#F3F6F5;font-weight:600;cursor:default}
.srow.grand{background:var(--tealbg);color:var(--ink);font-weight:700;cursor:default;font-family:var(--fc);font-size:18px}
.srow.head{background:#F3F6F5;font-size:13px;color:var(--ink2);font-weight:600;cursor:default}
.neg{color:var(--neg)}
.txns{background:#FAFCFB;border-bottom:1px solid var(--line2)}
.txn{display:flex;gap:12px;padding:6px 16px 6px 50px;font-size:14px;color:var(--ink2);border-top:1px dashed var(--line2)}
.txn .d{flex:0 0 86px;color:var(--ink3)}
.txn .x{flex:1;min-width:0}
.txn .x b{color:var(--ink);font-weight:600}
.txn .f{display:block;font-size:13px}
.txn .f a{text-decoration:none;border-bottom:1px solid var(--teal3)}
.txn .v{flex:0 0 120px;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:13.5px;color:var(--ink3);margin:10px 2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 13px;font-size:14px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}

/* journals + adjustments */
.jcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.jcard.posted{border-color:#9FD1B5;box-shadow:inset 4px 0 0 var(--pos)}
.jcard h3{margin:0 0 4px;font-size:16.5px}
.jcard p{margin:4px 0 8px;color:var(--ink2);font-size:14.5px}
.jl{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.jl td{padding:4px 6px;border-top:1px solid var(--line2)}
.jl td.n{text-align:right;font-variant-numeric:tabular-nums;width:120px}
.jactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.effect{font-size:14px;color:var(--ink2)}
.form input,.form select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.form .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.form .row input.acct{flex:1 1 260px}
.form .row input.amt{width:120px;text-align:right}
.err{color:var(--neg);font-size:14px}
.adjrow{display:grid;grid-template-columns:34px 1fr 140px 170px;gap:12px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line2)}
.adjrow:last-child{border-bottom:0}
.adjid{font-family:var(--fc);font-weight:700;font-size:20px;color:var(--teal);line-height:1.2}
.adjrow .t{font-weight:600}
.adjrow .w{font-size:14px;color:var(--ink2);margin-top:2px}
.adjrow .src{font-size:13.5px;margin-top:4px}
.adjrow .amt{text-align:right;font-family:var(--fc);font-size:20px;font-weight:600}
.decide{display:flex;gap:6px;justify-content:flex-end}
.decide button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:13.5px;cursor:pointer}
.decide button[aria-pressed="true"].yes{background:var(--pos);border-color:var(--pos);color:#fff}
.decide button[aria-pressed="true"].no{background:var(--ink2);border-color:var(--ink2);color:#fff}
.adjrow.declined .amt{color:var(--ink3);text-decoration:line-through}

/* downloads + build */
.dl{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.dl .ic{flex:0 0 40px;height:40px;border-radius:9px;background:var(--tealbg);display:grid;place-items:center}
.dl .ic svg{width:21px;height:21px;stroke:var(--teal);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dl .t{font-weight:600;font-size:16px}
.dl .d{color:var(--ink2);font-size:14.5px;margin:3px 0 10px;max-width:68ch}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.step b{display:block;font-family:var(--fc);font-size:19px;font-weight:600;margin-bottom:4px}
.step b::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--amber);color:#2B1E00;font-size:14px;margin-right:8px;vertical-align:2px}
.step p{margin:0;color:var(--ink2);font-size:14.5px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.phead{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.phead .pn{font-family:var(--fc);font-weight:700;font-size:22px;color:var(--teal);width:28px}
.phead .pt{flex:1;font-weight:600;font-size:16px}
.phead .chev{color:var(--ink3);transition:transform .2s}
.pcard.open .chev{transform:rotate(90deg)}
.pbody{display:none;padding:0 16px 16px 56px}
.pcard.open .pbody{display:block}
.ptext{white-space:pre-wrap;background:#F6F8F7;border:1px solid var(--line2);border-radius:8px;padding:12px 14px;font-size:14.5px;color:var(--ink);line-height:1.55;margin:10px 0}
.copied{font-size:13.5px;color:var(--pos);margin-left:6px}
.cta{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:28px;box-shadow:inset 0 4px 0 var(--amber)}
.cta h2{margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.facts .panel h3{margin-top:0}
.facts p{margin:0;color:var(--ink2);font-size:14.5px}
table.simple{width:100%;border-collapse:collapse;font-size:14.5px}
table.simple th{text-align:left;font-size:13px;color:var(--ink2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.simple td{padding:8px 10px;border-bottom:1px solid var(--line2)}
table.simple td.n,table.simple th.n{text-align:right;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:860px){table.simple{font-size:13px}table.simple td,table.simple th{padding:6px 5px}}

/* ---------- responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2,.grid2b{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}
@media (max-width:860px){
  #nav{transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 10px 40px rgba(20,35,44,.25)}
  body.navopen #nav{transform:none}
  body.navopen #scrim{display:block;position:fixed;inset:0;background:rgba(20,35,44,.35);z-index:35}
  #topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:9px 14px}
  #topbar .brand{padding:0}
  #topbar .mail{margin-left:auto}
  #topbar .li{font-weight:700;padding-left:11px;padding-right:11px}
  #main{margin-left:0}
  .page{padding:20px 16px 50px}
  .page h1{font-size:30px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:26px}
  .steps{grid-template-columns:1fr}
  .srow .a{flex-basis:110px}.srow .a2{display:none}
  .txn{padding-left:28px;flex-wrap:wrap}.txn .d{flex-basis:76px}.txn .v{flex-basis:90px}
  .adjrow{grid-template-columns:28px 1fr;}
  .adjrow .amt{text-align:left;grid-column:2}
  .adjrow .decide{grid-column:2;justify-content:flex-start}
  .pbody{padding-left:16px}
}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.kpis.k3{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media print{#nav,#topbar{display:none}#main{margin:0}}

/* Walkthrough deck */
.deckwrap{padding:22px 28px 30px;max-width:1240px;margin:0 auto}
.deckbar{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.deckbar h1{font-family:var(--fc);font-size:26px;font-weight:700;margin:0;flex:1 1 auto}
.deckbar .stamp{margin-right:6px}
.stagebox{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(20,35,44,.08)}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.slide{position:absolute;inset:0;padding:54px 70px;display:none;font-family:var(--f);color:var(--ink)}
.slide.on{display:block}
.slide h2{font-family:var(--fc);font-weight:700;font-size:58px;line-height:1.02;letter-spacing:-.5px;margin:0 0 14px;max-width:16ch}
.slide .sub{font-size:24px;color:var(--ink2);max-width:46ch;line-height:1.35;margin:0}
.slide .small{font-size:17px;color:var(--ink3)}
.illus{position:absolute;right:22px;bottom:16px;font-size:14px;color:var(--ink3);background:#F3F6F5;border:1px solid var(--line2);padding:3px 10px;border-radius:20px}
.deckctl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex:1 1 auto;flex-wrap:wrap}
.dots button{width:26px;height:6px;border-radius:3px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--amber)}
.dots button.seen{background:var(--teal3)}
.notes{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:none;font-size:15.5px;color:var(--ink2)}
.notes.on{display:block}
.notes b{color:var(--ink)}
.deckhelp{font-size:13.5px;color:var(--ink3)}
.stagebox:fullscreen{border:0;border-radius:0;background:#fff;width:100vw;height:100vh;aspect-ratio:auto}
.stagebox:-webkit-full-screen{width:100vw;height:100vh}
.fsnav{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:5}
.stagebox:fullscreen .fsnav{display:flex}

/* route line (steps) */
.route{position:absolute;left:70px;right:70px;top:26px;height:30px}
.route .track{position:absolute;left:0;right:0;top:13px;height:3px;background:var(--line)}
.route .done{position:absolute;left:0;top:13px;height:3px;background:var(--teal);transition:width .8s ease}
.route .stop{position:absolute;top:5px;transform:translateX(-50%);text-align:center;font-size:13px;color:var(--ink3);white-space:nowrap}
.route .stop i{display:block;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid var(--line);margin:0 auto 5px}
.route .stop.past i{border-color:var(--teal);background:var(--teal)}
.route .stop.now i{border-color:var(--amber);background:var(--amber);box-shadow:0 0 0 6px rgba(240,165,0,.22)}
.route .stop.now{color:var(--ink);font-weight:600}
.stepslide{padding-top:96px}
.stepslide h2{font-size:46px;max-width:none}
.cols{display:grid;grid-template-columns:330px 1fr;gap:36px;align-items:start;margin-top:12px}
.cols .say{font-size:21px;line-height:1.4;color:var(--ink2)}
.cols .say b{color:var(--ink)}

/* mock window (generic, illustration) */
.win{background:#FBFCFC;border:1px solid #CFD8D8;border-radius:12px;box-shadow:0 18px 50px rgba(20,35,44,.13);overflow:hidden;height:500px;display:grid;grid-template-rows:34px 1fr}
.win .bar{background:#F1F4F4;border-bottom:1px solid #DCE3E3;display:flex;align-items:center;gap:7px;padding:0 12px;font-size:13px;color:var(--ink3)}
.win .bar i{width:10px;height:10px;border-radius:50%;background:#D5DCDC;display:inline-block}
.win .bar span{margin-left:10px}
.win .body{display:grid;grid-template-columns:190px 1fr;min-height:0}
.win .rail{border-right:1px solid #E3E9E9;padding:14px 12px;font-size:14px;color:var(--ink2);background:#F7F9F9}
.win .rail .chip{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #DCE3E3;border-radius:8px;padding:7px 9px;margin-bottom:10px;font-size:13.5px}
.win .rail .chip svg{width:15px;height:15px;stroke:var(--teal);fill:none;stroke-width:2}
.win .main{padding:16px 20px;overflow:hidden;position:relative;min-height:0}

<script>/* Walkthrough deck: five short animated slides. Figures are quoted from the real run. */
(function(){
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = (n, dp=0) => (n<0?'-':'') + '£' + Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const gbpm = n => '£' + (n/1e6).toFixed(2) + 'm';
const MARK = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2L38 20 20 38 2 20z" fill="#0E5A6B"/><path d="M14 27V13h2.6l7 9.4V13H26v14h-2.5l-7.1-9.5V27z" fill="#fff"/></svg>';
const STOPS = ['Folder', 'Email', 'Collect', 'Gaps', 'Book', 'Judge', 'Adjust', 'Accounts'];
const ILL = '';
const route = k => `<div class="route"><div class="track"></div><div class="done" style="width:${Math.max(0, Math.min(1, k/(STOPS.length-1)))*100}%"></div>${STOPS.map((s,i) => `<div class="stop ${i<k?'past':i===k?'now':''}" style="left:${i/(STOPS.length-1)*100}%"><i></i>${s}</div>`).join('')}</div>`;
const routeAt = (k, label) => `<div class="routebox">${route(k).replace('class="route"', 'class="route static"')}${label ? `<div class="routelabel">${label}</div>` : ''}<div class="roadline"></div></div>`;
function wf(A){
  const items = A.items.filter(a => a.dec === 'approved'); const steps = [['Reported', A.reported, 1]].concat(items.map(a => [a.id, a.amt, 0])).concat([['Adjusted', A.adjusted, 1]]);
  const W = 500, H = 400, top = 30, bot = 340; let run = 0; const segs = [];
  for (const [n, v, tot] of steps){ if (tot){ segs.push([n, 0, v, tot]); run = v; } else { segs.push([n, run, run + v, 0]); run += v; } }
  const vals = segs.flatMap(s => s[3] ? [s[2]] : [s[1], s[2]]); const lo = Math.min(...vals) - 120000, hi = Math.max(...vals) + 40000;
  const y = v => bot - (Math.max(v, lo) - lo) / (hi - lo) * (bot - top); const bw = W / segs.length;
  let g = `<line x1="0" x2="${W}" y1="${bot}" y2="${bot}" stroke="#D9E0DF" stroke-width="2"/>`;
  segs.forEach(([n, a, b, tot], i) => { const x = i*bw + bw*0.16, w = bw*0.68, y0 = tot ? y(b) : y(Math.max(a, b)), h = tot ? bot - y(b) : Math.max(3, Math.abs(y(a) - y(b)));
    const col = tot ? (n === 'Adjusted' ? '#F0A500' : '#0E5A6B') : (b >= a ? '#1F7A4D' : '#B3412F');
    const lab = tot ? '£' + (b/1e6).toFixed(2) + 'm' : (b >= a ? '+' : '−') + '£' + Math.round(Math.abs(b - a)/1000) + 'k';
    g += `<rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="3" fill="${col}"/><text x="${x + w/2}" y="${y0 - 9}" text-anchor="middle" font-family="Barlow Condensed" font-weight="600" font-size="21" fill="#14232C">${lab}</text><text x="${x + w/2}" y="${bot + 26}" text-anchor="middle" font-family="Barlow" font-size="16" fill="#4A5B64">${n}</text>`; });

    main.querySelectorAll('.dots button').forEach(b => b.onclick = () => this.go(+b.dataset.k));
    main.querySelector('#stagebox').addEventListener('click', e => { if (e.target.closest('a,button')) return; this.go(this.i + 1); });
    main.querySelector('#dfs').onclick = () => this.fs();
    main.querySelector('#dnotes').onclick = () => this.notes();
    if (!this.keyBound){ this.keyBound = true; document.addEventListener('keydown', e => this.key(e)); window.addEventListener('resize', () => this.fit()); document.addEventListener('fullscreenchange', () => setTimeout(() => this.fit(), 60)); }
    this.active = true; this.fit(); this.show(this.i);
  },
  stop(){ this.active = false; this.clear(); },
  key(e){
    if (!this.active || e.target.closest('input,textarea,select')) return;
    if (['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); this.go(this.i + 1); }
    else if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); this.go(this.i - 1); }
    else if (e.key === 'Home') this.go(0); else if (e.key === 'End') this.go(this.S.length - 1);
    else if (e.key === 'f' || e.key === 'F') this.fs(); else if (e.key === 'n' || e.key === 'N') this.notes();
  },
  fit(){ const box = document.getElementById('stagebox'), st = document.getElementById('stage'); if (!box || !st) return;
    const w = box.clientWidth, h = box.clientHeight, k = Math.min(w / 1280, h / 720);
    st.style.transform = `translate(${(w - 1280*k)/2}px, ${(h - 720*k)/2}px) scale(${k})`; },
  fs(){ const box = document.getElementById('stagebox'); if (!box) return; if (document.fullscreenElement) document.exitFullscreen(); else if (box.requestFullscreen) box.requestFullscreen().catch(() => {}); else if (box.webkitRequestFullscreen) box.webkitRequestFullscreen(); },
  notes(){ const n = document.getElementById('dnotesbox'), b = document.getElementById('dnotes'); const on = n.classList.toggle('on'); b.setAttribute('aria-pressed', on); this.renderNotes(); },
  renderNotes(){ const n = document.getElementById('dnotesbox'); if (n) n.innerHTML = `<b>Slide ${this.i + 1}: ${esc(this.S[this.i].title)}.</b> ${esc(this.S[this.i].notes)}`; },
  clear(){ this.timers.forEach(clearTimeout); this.timers = []; },
  go(k){ if (k < 0 || k >= this.S.length) return; this.show(k); },
  show(k){
    this.clear(); this.i = k;
    const secs = document.querySelectorAll('#stage .slide'); if (!secs.length) return;
    secs.forEach(s => s.classList.remove('on'));
    const old = secs[k], fresh = old.cloneNode(false); fresh.innerHTML = this.S[k].html; old.replaceWith(fresh); fresh.classList.add('on');
    fresh.querySelectorAll('a[href^="#/"]').forEach(a => a.addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); }));
    document.querySelectorAll('.dots button').forEach((b, j) => { b.setAttribute('aria-current', j === k); b.classList.toggle('seen', j < k); });
    const c = document.getElementById('dcount'); if (c) c.textContent = `${k + 1} / ${this.S.length}`;
    this.renderNotes();
    if (history.replaceState) history.replaceState(null, '', `#/walkthrough/${k + 1}`);
    const s = this.S[k], reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || window.NWL_STATIC){ finalState(fresh, s); return; }
    if (s.play) s.play(fresh, (ms, fn) => this.timers.push(setTimeout(fn, ms)));
  },
  renderFinal(k){ this.show(k); this.clear(); const el = document.querySelectorAll('#stage .slide')[k]; finalState(el, this.S[k]); }
};
window.NWLDeck = Deck;

/* Northwind close demo: site app (fictional company). Data is loaded from small JSON chunks. */
(function(){

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmt = (n, dp=2) => { if (Math.abs(n) < 0.005) return '–'; const s = Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp}); return n<0 ? '('+s+')' : s; };
const gbp = (n, dp=0) => (n<0?'-':'') + '£' + Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const gbpShort = n => { const a=Math.abs(n), s=n<0?'-':''; if (a>=1e6) return s+'£'+(a/1e6).toFixed(2)+'m'; if (a>=1e3) return s+'£'+(a/1e3).toFixed(0)+'k'; return s+'£'+a.toFixed(0); };
const dmy = d => d.split('-').reverse().join('/');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };

let D, ACC, BYCODE = {}, BASE = [], J = [], DEC = {}, TX, B, T, MONTHLY;
const JKEY = 'nwl-demo-journals-v1', AKEY = 'nwl-demo-adj-v1';

// --------------------------------------------------------------------------- data
async function load(){
  const man = await fetch('data/manifest.json', {cache:'no-cache'}).then(r => r.json());
  const parts = await Promise.all(man.chunks.map(u => fetch(u, {cache:'no-cache'}).then(r => r.json())));
  const d = {}; for (const p of parts) for (const k in p){ if (Array.isArray(p[k]) && Array.isArray(d[k])) d[k] = d[k].concat(p[k]); else if (d[k] && typeof p[k] === 'object' && !Array.isArray(p[k])) Object.assign(d[k], p[k]); else d[k] = p[k]; }
  return d;
}
function init(d){
  D = d; ACC = D.acc;

  BASE = D.tx.map(([date, payee, narr, rc, kind, ps]) => ({date, payee, narr, rc, kind, ps}));
  const saved = store.get(JKEY, null);
  J = saved !== null ? saved : defaultJ();

function defaultJ(){ return D.ye.filter(y => (D.meta.default_posted || []).includes(y.id)).map(y => ({id:y.id, date:y.date, desc:y.desc, lines:y.lines.map(l => l.slice())})); }
function acctIndex(name){ let a = ACC.find(x => x.a === name || x.c === name); return a ? a.i : -1; }
function recompute(){
  const posted = J.map(j => ({date:j.date, payee:'Year-end journal', narr:j.desc, rc:'', kind:'Y', id:j.id, ps:j.lines}));
  TX = BASE.concat(posted);
  B = new Array(ACC.length).fill(0); T = ACC.map(() => []);
  for (const t of TX) for (const [ai, amt] of t.ps){ B[ai] += amt; T[ai].push(t); }
  for (let i=0;i<B.length;i++) B[i] = r2(B[i]);
  MONTHLY = monthly();
  const jb = $('#jcount'); if (jb){ const pend = D.ye.filter(y => !J.some(j => j.id === y.id)).length; jb.textContent = pend ? pend + ' to review' : ''; }
}
const bal = code => { const a = BYCODE[code]; return a ? B[a.i] : 0; };
const sumWhere = f => ACC.reduce((s, a) => s + (f(a) ? B[a.i] : 0), 0);
const sec = s => sumWhere(a => a.s === s);
function figures(Bx){
  const g = f => ACC.reduce((s, a) => s + (f(a) ? Bx[a.i] : 0), 0);
  const revenue = -g(a => a.r === 'Income');
  const sales = -g(a => a.s === 'Revenue');
  const direct = g(a => a.s === 'DirectCosts');
  const over = g(a => a.s === 'Overheads');
  const dep = g(a => a.s === 'DepreciationAndAmortisation');
  const fin = g(a => a.s === 'FinanceCosts');
  const tax = g(a => a.s === 'Taxation');
  const gp = revenue - direct, ebitda = gp - over, ebit = ebitda - dep, pbt = ebit - fin, pat = pbt - tax;
  return {revenue, sales, direct, over, dep, fin, tax, gp, ebitda, ebit, pbt, pat};

function adjAmount(a){ if (a.dyn){ const ai = acctIndex(a.dyn); return ai < 0 ? 0 : r2(a.dynSign * B[ai]); } return a.amt; }
function adjusted(){
  const f = figures(B); let net = 0, n = 0;
  for (const a of D.adj) if (DEC[a.id] === 'approved'){ net += adjAmount(a); n++; }
  return {reported: f.ebitda, net: r2(net), adjusted: r2(f.ebitda + net), n};
}
function leverage(){
  const cash = bal(D.meta.cash_code), debt = -bal(D.meta.loan_code);
  const adj = adjusted().adjusted; return {cash, debt, net: debt - cash, x: (debt - cash) / adj};
}
function monthly(){
  // month keys from Apr to Mar of the FY
  const keys = D.meta.months; const out = keys.map(k => ({k, rev:0, direct:0, over:0, ebitda:0, cash:0}));
  const idx = Object.fromEntries(keys.map((k,i)=>[k,i]));

function cashflow(){
  const f = figures(B); const o = D.meta.opening_bal; const d = c => bal(c) - (o[c] || 0);
  const wc = [['Decrease / (increase) in trade debtors', -d('610')], ['Decrease / (increase) in prepayments', -d('620')],
    ['Increase / (decrease) in trade creditors', -d('800')], ['Increase / (decrease) in accruals and deferred income', -(d('805') + d('810'))],
    ['Increase / (decrease) in VAT, PAYE and pensions', -(d('820') + d('825') + d('826'))], ['Increase / (decrease) in card, wages and expense claims', -(d('811') + d('814') + d('801'))]];
  const ops = f.pbt + f.dep + f.fin + wc.reduce((s,x)=>s+x[1],0);
  const taxPaid = -(f.tax + d('830'));   // charge less movement in provision
  const intPaid = -f.fin;
  const capex = -(d('720') + d('764'));
  const repay = (bal('900') - (o['900']||0));   // credit balances negative: repayment makes it less negative -> positive number
  const group = -d('615');
  const net = ops + taxPaid + intPaid + capex - repay + group;
  return {f, wc, ops, taxPaid, intPaid, capex, repay: -repay, group, net, dcash: d(D.meta.cash_code), open: o[D.meta.cash_code] || 0};
}

function bridgeSVG(a){
  const items = D.adj.filter(x => DEC[x.id] === 'approved').map(x => [x.id + ' ' + x.title.split(' ').slice(0,3).join(' '), adjAmount(x)]);
  const steps = [['Reported', a.reported, 'total']].concat(items.map(i => [i[0], i[1], 'step'])).concat([['Adjusted', a.adjusted, 'total']]);
  const W = 640, H = 250, L = 10, R = 10, top = 16, bot = 190;
  const lo = Math.min(a.reported, a.adjusted) * 0.96, hi = Math.max(...steps.reduce((acc, s, i) => { acc.push(acc.length ? acc[acc.length-1] : 0); return acc; }, []), a.reported, a.adjusted) * 1.0;
  let run = 0, maxv = a.reported; const cum = [];
  for (const s of steps){ if (s[2] === 'total'){ run = s[1]; cum.push([0, s[1]]); } else { cum.push([run, run + s[1]]); run += s[1]; } maxv = Math.max(maxv, run); }
  const vmin = Math.min(...cum.map(c => Math.min(c[0] || Infinity, c[1]))) * 0.985, vmax = maxv * 1.01;
  const y = v => bot - (v - vmin) / (vmax - vmin) * (bot - top);
  const bw = (W - L - R) / steps.length;
  let g = `<line x1="${L}" x2="${W-R}" y1="${bot}" y2="${bot}" stroke="#D9E0DF"/>`;
  steps.forEach((s, i) => { const [a0, a1] = cum[i]; const x = L + i*bw + bw*0.18, w = bw*0.64;
    const top0 = s[2] === 'total' ? y(s[1]) : y(Math.max(a0, a1)), h0 = s[2] === 'total' ? bot - y(s[1]) : Math.abs(y(a0) - y(a1));
    const col = s[2] === 'total' ? '#0E5A6B' : (s[1] >= 0 ? '#1F7A4D' : '#B3412F');
    g += `<rect x="${x}" y="${top0}" width="${w}" height="${Math.max(2,h0)}" rx="2" fill="${col}"/>`;
    g += `<text x="${x+w/2}" y="${top0-5}" text-anchor="middle" class="lbl">${s[2]==='total'?gbpShort(s[1]):(s[1]>=0?'+':'−')+gbpShort(Math.abs(s[1])).replace('-','')}</text>`;
    g += `<text x="${x+w/2}" y="${bot+16}" text-anchor="middle">${esc(s[0].split(' ')[0])}</text>`; });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="EBITDA bridge">${g}<text x="${L}" y="${H-6}">Axis does not start at zero, so the adjustments are visible.</text></svg>`;
}

function loadXLSX(){ return window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
function saveBlob(name, blob){ const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }

  const rows = [['Date', 'Account code', 'Account', 'Payee', 'Description', 'Debit', 'Credit', 'Evidence']];

  saveBlob('Northwind_FY26_General_Ledger.csv', new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], {type:'text/csv'}));
}
